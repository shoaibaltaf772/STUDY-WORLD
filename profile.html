<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile - Class 9 Notes</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation Bar -->

    <div class="navbar">

        <a href="index.html">🏠 Home</a>

        <a href="profile.html">👤 Profile</a>

        <a href="#">⚙ Settings</a>

        <a href="#">📞 Contact</a>

        <a href="#">ℹ About</a>

    </div>


    <!-- Profile -->

    <div class="profile-box">

        <h1>👤 My Profile</h1>

       <input type="text" placeholder="Enter your name" id="nameInput"><br><br>

       <input type="text" placeholder="Enter your class" id="classInput"><br><br>

       <input type="text"placeholder="Enter your school" id="schoolInput"><br><br>

       Save your profile information by clicking the button below:<br><br>

       <button onclick="saveProfile()">Save profile</button><br><br>

       <button onclick="removeProfile()">🗑️ Remove Profile</button><br><br>

        <a href="index.html">
            <button>⬅ Back to Notes</button>
        </a>

        <br><br>



    </div>

     <script>

window.onload = function () {

    document.getElementById("nameInput").value =
        localStorage.getItem("profileName") || "";

    document.getElementById("classInput").value =
        localStorage.getItem("profileClass") || "";

    document.getElementById("schoolInput").value =
        localStorage.getItem("profileSchool") || "";

};


function saveProfile() {

    localStorage.setItem(
        "profileName",
        document.getElementById("nameInput").value
    );

    localStorage.setItem(
        "profileClass",
        document.getElementById("classInput").value
    );

    localStorage.setItem(
        "profileSchool",
        document.getElementById("schoolInput").value
    );

    alert("✅ Profile Saved!");
}


function removeProfile() {

    localStorage.removeItem("profileName");
    localStorage.removeItem("profileClass");
    localStorage.removeItem("profileSchool");

    document.getElementById("nameInput").value = "";
    document.getElementById("classInput").value = "";
    document.getElementById("schoolInput").value = "";

    alert("🗑️ Profile Removed!");

}

</script>


</body>

</html>
